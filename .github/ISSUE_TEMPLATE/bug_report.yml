name: Bug Report
description: Report an issue, unexpected behavior, or error in EdgeStash
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Description of the Problem
      description: A clear and concise description of what the bug is.
      placeholder: When I perform corner churn on monitor 2, the drawer...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue step-by-step?
      placeholder: |
        1. Open EdgeStash daemon with `edgestash-cli status`
        2. Drag a File Explorer window to the left edge
        3. Release mouse cursor
        4. See error or unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows OS Version & Build
      description: Run `winver` or `[System.Environment]::OSVersion` in PowerShell.
      placeholder: Windows 11 Pro 23H2 (Build 22631.4460)
    validations:
      required: true

  - type: input
    id: display_setup
    attributes:
      label: Display & Monitor Setup
      description: Number of monitors, resolutions, and display scaling percentages.
      placeholder: Dual 4K (3840x2160 @ 150% scaling, 1920x1080 @ 100% scaling)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Daemon Logs or Terminal Output
      description: Run `edgestash-cli status` or check `%APPDATA%\EdgeStash\logs\`.
      render: shell
