<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background: #0f141c; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="50%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="200" rx="8" fill="url(#bgGlow)" />
  <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#edgeGlow)" />

  <g opacity="0.12" transform="translate(560, 20)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="15" y="15" width="170" height="22" rx="4" fill="#38bdf8" />
    <rect x="15" y="48" width="80" height="85" rx="4" fill="#6366f1" />
    <rect x="105" y="48" width="80" height="85" rx="4" fill="#a855f7" />
    <circle cx="175" cy="26" r="4" fill="#0f141c" />
  </g>

  <!-- Left Accent Drawer Glyph -->
  <g transform="translate(48, 50)">
    <rect x="0" y="0" width="96" height="96" rx="18" fill="#182234" stroke="#25354f" stroke-width="2" />
    <path d="M 0 16 C 0 8 8 0 16 0 L 28 0 L 28 96 L 16 96 C 8 96 0 88 0 80 Z" fill="url(#accentGrad)" />
    <rect x="40" y="24" width="40" height="8" rx="4" fill="#94a3b8" />
    <rect x="40" y="44" width="40" height="8" rx="4" fill="#94a3b8" />
    <rect x="40" y="64" width="24" height="8" rx="4" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <g transform="translate(170, 75)">
    <text x="0" y="0" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">Edge<tspan fill="url(#accentGrad)">Stash</tspan></text>
    <text x="0" y="32" font-size="15" font-weight="450" fill="#94a3b8">Ultra-Low-Latency Edge Drawers &amp; Window Stashing for Windows 11/10</text>
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="95" height="22" rx="11" fill="#1e293b" />
      <text x="47" y="15" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">0.0% IDLE CPU</text>

      <rect x="105" y="0" width="95" height="22" rx="11" fill="#1e293b" />
      <text x="152" y="15" font-size="11" font-weight="600" fill="#a855f7" text-anchor="middle">DAW FRIENDLY</text>

      <rect x="210" y="0" width="95" height="22" rx="11" fill="#1e293b" />
      <text x="257" y="15" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">PURE RUST</text>

      <rect x="315" y="0" width="95" height="22" rx="11" fill="#1e293b" />
      <text x="362" y="15" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">asInvoker</text>
    </g>
  </g>
</svg>
